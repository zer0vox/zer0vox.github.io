<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="greenhueblues">
<!--
  The golden spiral, built rather than drawn.

  A golden rectangle (PHI:1) is subdivided square by square, each square's side
  the previous one divided by PHI, and the mark is the quarter arc inscribed in
  each. Every arc sweeps clockwise about the corner of its own square, which is
  what makes the joins tangent continuous instead of kinked. The coordinates
  below are that construction evaluated at PHI = 1.6180339887, not a Fibonacci
  approximation of it.

  Five arcs, not the eight the construction happily keeps going for. Arc six
  has a radius of about 2.9 units against a 6 unit stroke, so at 16px it sits
  well under one pixel and does nothing but fill the eye of the spiral with
  mush. The line stops there and the round cap closes it; the eye reads as
  continuing on its own.

  Stroke 6 of a 64 viewBox is 1.5px at 16px. That is heavy for a line this
  size, deliberately: this has to hold up in a tab strip, not on a poster.

  Colours are the site's own tokens from :root in src/index.css, where #0d0d0d
  is the bg token and #a8c7ff is the accent. The field is solid rather than
  transparent because periwinkle on white is about 1.6:1 contrast and vanishes
  into a light tab strip.

  Note for editing: no double hyphen may appear anywhere in this comment. XML
  forbids it, and the whole file fails to parse rather than degrading.
-->
  <title>greenhueblues</title>
  <rect width="64" height="64" fill="#0d0d0d"/>
  <path d="M5.00 48.69A33.37 33.37 0 0 1 38.37 15.31A20.63 20.63 0 0 1 59.00 35.94A12.75 12.75 0 0 1 46.25 48.69A7.88 7.88 0 0 1 38.37 40.81A4.87 4.87 0 0 1 43.24 35.94" fill="none" stroke="#a8c7ff" stroke-width="6" stroke-linecap="round"/>
</svg>
